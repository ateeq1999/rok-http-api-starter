[package]
name = "rok-api-start"
version = "0.6.1"
edition = "2021"
publish = false

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
rok-core = { version = "0.6", features = ["api"] }
rok-auth = { version = "0.6", features = ["axum", "social", "magic-link"] }
rok-orm = { version = "0.6", features = ["postgres", "query", "migrate", "axum"] }
rok-validate = { version = "0.3", features = ["axum"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio-native-tls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
async-trait = "0.1"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "tokio1"] }
rand = "0.8"
hex = "0.4"
sha2 = "0.10"
