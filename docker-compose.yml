name: rok-api-starter

services:
  app:
    container_name: rok-api-starter
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    ports:
      - "8080:8080"
    environment:
      APP_URL: "http://localhost:8080"
      GOOGLE_REDIRECT_URI: "http://localhost:8080/auth/google/callback"
    networks:
      - infra

networks:
  infra:
    external: true
