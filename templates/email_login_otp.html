<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; line-height: 1.6; color: #333; max-width: 600px; margin: 0 auto; padding: 20px; }
        .code { font-size: 32px; font-weight: bold; letter-spacing: 8px; color: #4f46e5; text-align: center; padding: 16px; background: #f3f4f6; border-radius: 8px; margin: 16px 0; }
        .footer { margin-top: 32px; font-size: 12px; color: #888; }
    </style>
</head>
<body>
    <p>Hi {{name}},</p>
    <p>Use this code to sign in to your account:</p>
    <div class="code">{{code}}</div>
    <p>This code expires in 10 minutes.</p>
    <p class="footer">If you didn't request this, you can safely ignore this email.</p>
</body>
</html>
