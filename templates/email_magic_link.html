<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; line-height: 1.6; color: #333; max-width: 600px; margin: 0 auto; padding: 20px; }
        .btn { display: inline-block; background: #4f46e5; color: white !important; text-decoration: none; padding: 12px 24px; border-radius: 6px; font-weight: 600; margin: 16px 0; }
        .footer { margin-top: 32px; font-size: 12px; color: #888; }
    </style>
</head>
<body>
    <p>Hi {{name}},</p>
    <p>Click the button below to sign in to your account. This link expires in 15 minutes.</p>
    <p><a href="{{magic_url}}" class="btn">Sign In</a></p>
    <p>Or copy this link: {{magic_url}}</p>
    <p class="footer">If you didn't request this, you can safely ignore this email.</p>
</body>
</html>
