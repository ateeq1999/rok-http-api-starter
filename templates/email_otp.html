<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"></head>
<body style="margin:0;padding:0;background:#f4f4f4;font-family:'Segoe UI',Arial,sans-serif">
<table width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f4;padding:40px 0">
<tr><td align="center">
<table width="600" cellpadding="0" cellspacing="0" style="background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.08)">
<tr><td style="background:#4f46e5;padding:32px 40px;text-align:center">
<h1 style="margin:0;color:#fff;font-size:24px;font-weight:600">Verify Your Email</h1>
</td></tr>
<tr><td style="padding:40px">
<p style="margin:0 0 16px;color:#374151;font-size:16px;line-height:1.6">Hi {{name}},</p>
<p style="margin:0 0 24px;color:#374151;font-size:16px;line-height:1.6">
Thanks for signing up! Click the button below to verify your email address. This link expires in <strong>24 hours</strong>.
</p>
<table cellpadding="0" cellspacing="0" style="margin:0 auto 32px">
<tr><td style="background:#4f46e5;border-radius:6px;padding:12px 32px">
<a href="{{verify_url}}" style="color:#fff;font-size:16px;font-weight:600;text-decoration:none;display:inline-block">Verify Email</a>
</td></tr>
</table>
<p style="margin:0 0 8px;color:#6b7280;font-size:14px">Or copy this token:</p>
<code style="display:block;padding:12px 16px;background:#f9fafb;border:1px solid #e5e7eb;border-radius:4px;color:#374151;font-size:13px;word-break:break-all">{{token}}</code>
</td></tr>
<tr><td style="padding:24px 40px;border-top:1px solid #e5e7eb;text-align:center">
<p style="margin:0;color:#9ca3af;font-size:12px">If you didn't create an account, ignore this email.</p>
</td></tr>
</table>
</td></tr>
</table>
</body>
</html>
